<text x="24" y="28" class="t1" font-size="16" text-anchor="start" font-weight="600">Validation throughput: JSON Schema (Ajv) vs Internet Object</text><text x="24" y="48" class="t2" font-size="12" text-anchor="start" font-weight="400">Documents per second of 1,000 records, log scale, longer is faster. Internet Object highlighted.</text><text x="24" y="82" class="t1" font-size="13" text-anchor="start" font-weight="600">Users — 1,000 records</text><text x="180" y="104" class="t2" font-size="10" text-anchor="end" font-weight="400">Text → validated data</text><text x="180" y="121" class="t2" font-size="12" text-anchor="end" font-weight="400">JSON.parse + Ajv</text><rect x="190" y="110" width="256.0607755329197" height="14" rx="3" class="other"/><text x="452.0607755329197" y="121" class="t2" font-size="12" text-anchor="start" font-weight="400">465</text><text x="180" y="145" class="t1" font-size="12" text-anchor="end" font-weight="600">IO parse (typed schema)</text><rect x="190" y="134" width="112.89270877319774" height="14" rx="3" class="s1"/><text x="308.89270877319774" y="145" class="t1" font-size="12" text-anchor="start" font-weight="600">15</text><text x="180" y="166" class="t2" font-size="10" text-anchor="end" font-weight="400">Text → data, no validation</text><text x="180" y="183" class="t2" font-size="12" text-anchor="end" font-weight="400">JSON.parse</text><rect x="190" y="172" width="265.18929860112934" height="14" rx="3" class="other"/><text x="461.18929860112934" y="183" class="t2" font-size="12" text-anchor="start" font-weight="400">579</text><text x="180" y="207" class="t1" font-size="12" text-anchor="end" font-weight="600">IO parse (untyped header)</text><rect x="190" y="196" width="115.64069893540034" height="14" rx="3" class="s1"/><text x="311.64069893540034" y="207" class="t1" font-size="12" text-anchor="start" font-weight="600">16</text><text x="180" y="228" class="t2" font-size="10" text-anchor="end" font-weight="400">Objects → validated</text><text x="180" y="245" class="t2" font-size="12" text-anchor="end" font-weight="400">Ajv (compiled)</text><rect x="190" y="234" width="320.01841057170816" height="14" rx="3" class="other"/><text x="516.0184105717082" y="245" class="t2" font-size="12" text-anchor="start" font-weight="400">2,155</text><text x="180" y="269" class="t1" font-size="12" text-anchor="end" font-weight="600">IO validateCollection</text><rect x="190" y="258" width="162.98968441016825" height="14" rx="3" class="s1"/><text x="358.98968441016825" y="269" class="t1" font-size="12" text-anchor="start" font-weight="600">50</text><line x1="190" x2="190" y1="90" y2="278" class="axis" stroke-width="1"/><text x="24" y="312" class="t1" font-size="13" text-anchor="start" font-weight="600">Metrics — 1,000 records</text><text x="180" y="334" class="t2" font-size="10" text-anchor="end" font-weight="400">Text → validated data</text><text x="180" y="351" class="t2" font-size="12" text-anchor="end" font-weight="400">JSON.parse + Ajv</text><rect x="190" y="340" width="298.78771247517705" height="14" rx="3" class="other"/><text x="494.78771247517705" y="351" class="t2" font-size="12" text-anchor="start" font-weight="400">1,295</text><text x="180" y="375" class="t1" font-size="12" text-anchor="end" font-weight="600">IO parse (typed schema)</text><rect x="190" y="364" width="152.3556474658168" height="14" rx="3" class="s1"/><text x="348.3556474658168" y="375" class="t1" font-size="12" text-anchor="start" font-weight="600">39</text><text x="180" y="396" class="t2" font-size="10" text-anchor="end" font-weight="400">Text → data, no validation</text><text x="180" y="413" class="t2" font-size="12" text-anchor="end" font-weight="400">JSON.parse</text><rect x="190" y="402" width="298.7502510916914" height="14" rx="3" class="other"/><text x="494.7502510916914" y="413" class="t2" font-size="12" text-anchor="start" font-weight="400">1,294</text><text x="180" y="437" class="t1" font-size="12" text-anchor="end" font-weight="600">IO parse (untyped header)</text><rect x="190" y="426" width="152.6687944540294" height="14" rx="3" class="s1"/><text x="348.6687944540294" y="437" class="t1" font-size="12" text-anchor="start" font-weight="600">39</text><text x="180" y="458" class="t2" font-size="10" text-anchor="end" font-weight="400">Objects → validated</text><text x="180" y="475" class="t2" font-size="12" text-anchor="end" font-weight="400">Ajv (compiled)</text><rect x="190" y="464" width="401.1803844102526" height="14" rx="3" class="other"/><text x="597.1803844102526" y="475" class="t2" font-size="12" text-anchor="start" font-weight="400">15,099</text><text x="180" y="499" class="t1" font-size="12" text-anchor="end" font-weight="600">IO validateCollection</text><rect x="190" y="488" width="167.37802521668505" height="14" rx="3" class="s1"/><text x="363.37802521668505" y="499" class="t1" font-size="12" text-anchor="start" font-weight="600">55</text><line x1="190" x2="190" y1="320" y2="508" class="axis" stroke-width="1"/><text x="190" y="530" class="t2" font-size="10" text-anchor="middle" font-weight="400">1</text><text x="286" y="530" class="t2" font-size="10" text-anchor="middle" font-weight="400">10</text><text x="382" y="530" class="t2" font-size="10" text-anchor="middle" font-weight="400">100</text><text x="478" y="530" class="t2" font-size="10" text-anchor="middle" font-weight="400">1,000</text><text x="574" y="530" class="t2" font-size="10" text-anchor="middle" font-weight="400">10,000</text><text x="670" y="530" class="t2" font-size="10" text-anchor="middle" font-weight="400">100,000</text>
